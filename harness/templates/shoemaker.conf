# shoemaker.conf: this project's Shoemaker settings, sourced by the runner,
# land.sh and the guard. `shoemaker init` writes it once; edit it freely.
# What to work on, the mode and the model are steered in DIRECTION.md instead.

PROJECT="__PROJECT__"            # short name, used in unit names and log labels
REPO="__REPO__"                  # the main checkout (absolute path)
UMBRELLA="__UMBRELLA__"          # agent workspace outside Git (README.md, STATUSLOG.md), or "" if none

HOST="__HOST__"                  # github | gitlab | none (no remote)
REMOTE="origin"
DEFAULT_BRANCH="__DEFAULT_BRANCH__"
BRANCH_PREFIX="shoemaker/"       # the agents' branches: <prefix>q<item>-<slug>
GITLAB_API_HOST="__GITLAB_API_HOST__"   # self-hosted GitLab with its API on another host/path, e.g. gitlab.example.org/git; "" otherwise

# What must be green before anything merges:
#   ci     merge only when the PR's CI passed (while the repo has no CI, ship acts as review)
#   local  land.sh runs SETUP_CMD and VERIFY_CMD on the rebased commit, and merges only if they pass
#   none   never merge automatically (ship acts as review)
GATE="__GATE__"
SETUP_CMD="__SETUP_CMD__"        # prepares a fresh worktree, e.g. "npm ci"
VERIFY_CMD="__VERIFY_CMD__"      # the project's checks, e.g. "npm test"

# The repo's own publishing machinery, if it has some (most do not):
LAND_CMD=""                      # its landing script (push, PR, auto-merge); "" = Shoemaker's land.sh
GUARD_CMD=""                     # its own push-guard installer; "" = Shoemaker's worktree hooks
SYNC_CMD=""                      # how to update the main checkout after a merge; "" = fast-forward (SYNC_MAIN)

GUARD=1                          # 1: hooks keep the agents off DEFAULT_BRANCH and out of the harness; 0: instructions only
SYNC_MAIN=1                      # 1: fast-forward the main checkout each round, when it is a clean DEFAULT_BRANCH
STATUSLOG=""                     # a status log the agents append to after each run (e.g. "$UMBRELLA/STATUSLOG.md"), or ""
AGENT_ENV=""                     # extra environment for both agents, space-separated KEY=VALUE pairs
DASHBOARD_URL="__DASHBOARD_URL__"   # where you review the queue; shown to the agents and in the logs

UNIT="shoemaker-__PROJECT__"     # systemd user units: $UNIT.timer, $UNIT.service, $UNIT-dashboard.service
TIMEOUT="5h"                     # hard stop for each implementation agent (h, m or s; integers)
SUGGEST_TIMEOUT="1h"             # hard stop for the suggestion agent
APPLY_TIMEOUT="5m"               # hard stop for the dashboard's team interpreter
PERMISSION_MODE="bypassPermissions"
MAX_AGENTS=16                    # hard cap across all team roles/stages (and the legacy round)
KEEP_DAYS=60                     # how long run logs are kept
